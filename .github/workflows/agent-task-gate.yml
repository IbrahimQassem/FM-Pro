name: Agent Task Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: agent-task-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report manual pull request
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'agent-change') }}
        run: echo "Manual PR; no agent task contract is required."

      - name: Check out pull request
        if: contains(github.event.pull_request.labels.*.name, 'agent-change')
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        if: contains(github.event.pull_request.labels.*.name, 'agent-change')
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Reject policy and sensitive file changes
        if: contains(github.event.pull_request.labels.*.name, 'agent-change')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          while IFS= read -r changed_file; do
            case "$changed_file" in
              .agents/README.md|.agents/roles/*|.agents/skills/*|.github/*|AGENTS.md|docs/contracts/*|gradle/wrapper/*|build.gradle|settings.gradle|gradle.properties|app/build.gradle|firestore.rules|storage.rules|tools/agent-task.py|tools/verify-governance.sh|key.properties|*.jks|*.keystore|*.p12|*.pem|*.key|*.env|*.env.*|*/google-services.json)
                echo "::error file=$changed_file::Protected or sensitive path is outside agent automation"
                exit 1
                ;;
            esac
          done < <(git diff --name-only --diff-filter=ACMRD "$BASE_SHA...$HEAD_SHA")

      - name: Find the task contract
        if: contains(github.event.pull_request.labels.*.name, 'agent-change')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          task_file=$(python3 tools/agent-task.py discover \
            --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA" --require-one)
          echo "AGENT_TASK_FILE=$task_file" >> "$GITHUB_ENV"

      - name: Validate task contract
        if: contains(github.event.pull_request.labels.*.name, 'agent-change')
        run: python3 tools/agent-task.py validate "$AGENT_TASK_FILE"

      - name: Enforce changed-file scope
        if: contains(github.event.pull_request.labels.*.name, 'agent-change')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 tools/agent-task.py scope "$AGENT_TASK_FILE"
          --base-ref "$BASE_SHA" --head-ref "$HEAD_SHA"
