name: Android CI

on:
  push:
    branches: [hudhudfm]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Missing GOOGLE_SERVICES_JSON_BASE64 repository secret"
            exit 1
          fi
          umask 077
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      - name: Verify governance
        run: ./tools/verify-governance.sh

      - name: Run unit tests
        run: ./gradlew testHudhudfm_google_playDebugUnitTest --no-daemon

      - name: Build listener variants
        run: >-
          ./gradlew
          app:assembleHudhudfm_google_playDebug
          app:assembleHudhud_fmDebug
          --no-daemon
