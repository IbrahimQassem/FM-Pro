name: Agent development task
description: Propose one bounded FM-Pro roadmap task for agent execution
title: "[Agent Task]: "
labels:
  - agent-ready
body:
  - type: input
    id: roadmap_item
    attributes:
      label: Roadmap item
      description: Use one ID from docs/roadmap/phased-delivery-plan.md.
      placeholder: P5-01
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Observable objective
      description: Describe one outcome, not a broad phase or rewrite.
    validations:
      required: true

  - type: textarea
    id: allowed_scope
    attributes:
      label: Proposed allowed paths
      description: List narrow repository-relative files or directories, one per line.
      placeholder: |
        app/src/main/java/com/sana/dev/fm/playback/
        app/src/test/java/com/sana/dev/fm/playback/
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - low
        - medium
        - high
        - critical
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: List observable pass/fail criteria and affected variants.
    validations:
      required: true

  - type: textarea
    id: rollback
    attributes:
      label: Rollback
      description: State how this bounded change can be reversed safely.
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Automation safety
      options:
        - label: This task does not require production writes, secrets, signing, destructive actions, Firebase Rules changes, or release operations.
          required: true
